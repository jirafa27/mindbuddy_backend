[pytest]
# Указываем, где искать тесты
testpaths = tests
# Автоматически распознавать асинхронные тесты
asyncio_mode = auto
# Чтобы pytest видел папку app без манипуляций с PYTHONPATH
pythonpath = .
# Настройки для плагина pytest-asyncio: один loop на тест — тест и ASGI-запрос в одном loop
asyncio_default_fixture_loop_scope = function
# Показывать подробный отчет и подавлять лишние предупреждения
addopts = -v -p no:warnings